name: Feed sync (every 6 hours)

# Keeps the site current between content runs: new podcast episodes appear on
# the site within hours of release, the FBI live case board stays fresh, the
# case watcher files new developments for review, and case pages rebuild from
# the community database. Secrets: SUPABASE_*, GEMINI_API_KEY (repo settings).

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (offset to dodge top-of-hour congestion)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull feeds, watch cases, rebuild
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node automation/import-feed.mjs || true
          node automation/import-fbi.mjs || true
          node automation/case-watch.mjs || true
          node automation/build-all.mjs
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync: podcast feed + live case board (CI)"
            git push
          fi
