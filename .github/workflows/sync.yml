name: Feed sync (every 6 hours)

# Keeps the site current between content runs: new podcast episodes appear on
# the site within hours of release, and the FBI live case board stays fresh —
# no PC required, no AI, no keys.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (offset to dodge top-of-hour congestion)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull feeds + rebuild
        run: |
          node automation/import-feed.mjs || true
          node automation/import-fbi.mjs || true
          node automation/build-all.mjs
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync: podcast feed + live case board (CI)"
            git push
          fi
